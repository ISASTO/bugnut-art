<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.28"
      numOctaves="5"
      seed="31"
      stitchTiles="stitch"
      result="noise"
    />
    <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope="0.55" intercept="0.16" />
      <feFuncG type="linear" slope="0.48" intercept="0.14" />
      <feFuncB type="linear" slope="0.36" intercept="0.1" />
      <feFuncA type="table" tableValues="0 0.24" />
    </feComponentTransfer>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.035"
      numOctaves="3"
      seed="12"
      stitchTiles="stitch"
      result="clouds"
    />
    <feColorMatrix in="clouds" type="saturate" values="0" />
  </filter>
  <rect width="320" height="320" fill="#efe4ca" />
  <rect
    width="320"
    height="320"
    filter="url(#mottle)"
    opacity="0.055"
    style="mix-blend-mode:multiply"
  />
  <rect
    width="320"
    height="320"
    filter="url(#grain)"
    opacity="0.3"
    style="mix-blend-mode:multiply"
  />
</svg>
